    <main>
        <h2>Contactez-nous</h2>
        <section>
                <article>
                <p><h3>N'hésitez pas à contacter notre agence pour plus d'informations ou pour organiser votre prochain voyage !</h3></p>
                <ul type="circle">
                    <li>Adresse : Tunis, Tunisie.</li>
                    <li>Téléphone : 71 000 000.</li>
                    <li>contact@travelexplorer.tn</li>
                </ul>
                </article>
        </section>
    </main>
    <fieldset>
        <div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
    <form>
    <div class="mb-3">
    <label class="form-label">Nom complet :</label>
    <input type="text" class="form-control" placeholder="Votre nom complet" required>
</div>
    </fieldset>
    <fieldset>
        <div class="mb-3">
        <label class="form-label">Adresse e-mail :</label>
        <input type="email" class="form-control" placeholder="votre e-mail" required><br>
        </div>
    </fieldset>
    <fieldset>
        <div class="mb-3">
    <label class="form-label">Destination souhaitée :</label>
    <select class="form-select">
        <option value="Paris">Paris</option>
        <option value="Istanbul">Istanbul</option>
        <option value="Bali">Bali</option>
    </select>
</div>
    </fieldset>
    <fieldset>
        <div class="mb-3">
    <label class="form-label">Date de départ :</label>
    <input type="date" class="form-control" required>
</div> 
    </fieldset>
    <fieldset>
    <div class="mb-3">
    <label class="form-label">Nombre de voyageurs :</label>
    <input type="number" min="1" class="form-control" placeholder="Votre nombre" required>
</div>    
    </fieldset>
    <fieldset>
        <div class="mb-3">
    <label class="form-label">Message :</label>
    <textarea class="form-control" name="" id=""></textarea>
</div>
    </fieldset>
    <div class="mb-3">
    <label class="form-label">Envoyer la demande</label>
    <button type="submit" value="envoyer" class="btn btn-primary">Envoyer la demande</button>
</div>
    </form>
